# Tipoff canonical URL, legacy page redirects, and cached-client endpoints.
RewriteRule ^(?:sports|tip-off)/?$ /tipoff [R=302,END]
RewriteRule ^tipoff/$ /tipoff [R=302,END]
RewriteCond %{THE_REQUEST} \s/+tip-off\.html(?:[?\s])
RewriteRule ^tip-off\.html$ /tipoff [R=302,END]
RewriteRule ^tipoff$ tip-off.html [END]
RewriteRule ^(?:tipoff|tip-off)/guide\.css$ assets/css/tipoff-guide.css [END]
RewriteRule ^(?:tipoff|tip-off)/guide\.js$ assets/scripts/tipoff-guide.js [END]
RewriteRule ^(?:tipoff|tip-off)/schedule$ api/tipoff-schedule.php [END]
