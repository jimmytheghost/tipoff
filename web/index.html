  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&amp;family=Roboto:wght@400..800&amp;display=swap">
  <link rel="stylesheet" href="/tip-off/guide.css?v=20261107-04">
  <script type="module" src="/tip-off/guide.js?v=20261107-04"></script>
</head>
<body class="tipoff-flat">
  <header class="tipoff-header">
    <div class="tipoff-header-inner">
      <a class="tipoff-brand" href="/tip-off">Tipoff</a>
      <nav aria-label="Tipoff navigation">
        <a class="tipoff-back" href="https://www.jimmyweber.com/">Back to JimmyWeber.com</a>
      </nav>
    </div>
  </header>
  <main class="tipoff-guide">
    <h1 class="tipoff-visually-hidden">Game schedule</h1>
    <div class="tipoff-date" role="group" aria-label="Schedule date">
      <button class="button" id="previous" type="button" aria-label="Previous day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <p id="date" aria-live="polite"></p>
      <button class="button" id="next" type="button" aria-label="Next day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="button" id="today" type="button">Today</button>
    </div>
    <h2 id="highlights-title" class="tipoff-highlights-title">National Broadcasts</h2>
    <section class="tipoff-summary" id="following" aria-label="Following" hidden>
      <p id="followed-status" class="tipoff-meta" role="status"></p>
      <div id="followed-leagues" class="tipoff-summary-groups"></div>
    </section>
    <section class="tipoff-summary" aria-labelledby="national-title">
      <h2 id="national-title" hidden>National Broadcasts</h2>
      <p id="national-status" class="tipoff-meta" role="status"></p>
      <div id="national-leagues" class="tipoff-summary-groups"></div>
    </section>
    <noscript><p>Enable JavaScript to load schedules for your time zone.</p></noscript>
    <details class="tipoff-all-games" id="all-games">
      <summary>All Games</summary>
      <p class="tipoff-zone"><span class="tipoff-zone-label">Time zone</span> <span id="zone"></span></p>
      <div class="tipoff-filters" role="group" aria-label="Filter by league">
        <button class="button" type="button" data-league="all" aria-pressed="true">All</button>
        <button class="button" type="button" data-league="nba" aria-pressed="false"><span>NBA</span></button>
        <button class="button" type="button" data-league="nfl" aria-pressed="false"><span>NFL</span></button>
        <button class="button" type="button" data-league="wnba" aria-pressed="false"><span>WNBA</span></button>
        <button class="button" type="button" data-league="nhl" aria-pressed="false"><span>NHL</span></button>
        <button class="button" type="button" data-league="mlb" aria-pressed="false"><span>MLB</span></button>
      </div>
      <div id="leagues" class="tipoff-leagues"></div>
    </details>
  </main>
  <footer class="tipoff-footer">
    <div class="tipoff-header-inner">
      <a class="tipoff-back" href="https://www.jimmyweber.com/">Back to JimmyWeber.com</a>
    </div>
  </footer>
</body>
</html>
